<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ Thống Đặt Hẹn Xưởng Dịch Vụ Ô Tô</title>
    <meta name="description" content="Ứng dụng quản lý lịch hẹn dịch vụ bảo dưỡng, sửa chữa ô tô theo khoang làm việc và đồng bộ Google Sheets" />
    <meta property="og:title" content="Hệ Thống Đặt Hẹn Xưởng Dịch Vụ Ô Tô" />
    <meta property="og:description" content="Ứng dụng quản lý lịch hẹn dịch vụ bảo dưỡng, sửa chữa ô tô theo khoang làm việc và đồng bộ Google Sheets" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('workshop_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
